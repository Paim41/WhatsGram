name: whatsgram
description: Personal native Telegram client with a shared two-account workspace.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  crypto: 3.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  ffi: 2.2.0
  path: 1.9.1
  path_provider: 2.1.6
  flutter_secure_storage: 10.3.4
  uuid: 4.6.0
  file_selector: 1.1.0
  record: 6.2.1
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  flutter_local_notifications: 19.5.0
  desktop_drop: 0.6.1
  qr_flutter: 4.1.0
  url_launcher: 6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
